# Déclencheur de secours pour le forfait Vercel Hobby (qui n'autorise qu'un cron par jour) :
# enchaîne les sessions temps réel du moteur (~5 min chacune). Inutile sur Vercel Pro (cron à la minute).
name: tick
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    if: vars.TICK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enchaîner deux sessions temps réel (~10 minutes)
        env:
          TICK_URL: ${{ vars.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          end=$((SECONDS + 560))
          while [ $SECONDS -lt $end ]; do
            curl -sS -m 310 -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL/api/cron/tick" || true
            echo
            sleep 2
          done
